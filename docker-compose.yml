services:
  portal:
    image: etlers_portal:latest
    build:
      context: ./portal
    container_name: etlers-portal
    restart: unless-stopped

  contact-api:
    build:
      context: ./contact_api
    image: etlers-contact-api:latest
    container_name: etlers-contact-api
    restart: unless-stopped
    environment:
      PORT: 8001
      SLACK_INFO_PATH: /app/env/slack_info.json
    volumes:
      - ./env/slack_info.json:/app/env/slack_info.json:ro

  gateway:
    image: caddy:2.8-alpine
    container_name: etlers-gateway
    restart: unless-stopped
    depends_on:
      - portal
      - contact-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-etlersadm@gmail.com}
      PORTAL_UPSTREAM_HOST: ${PORTAL_UPSTREAM_HOST:-portal}
      PORTAL_UPSTREAM_PORT: ${PORTAL_UPSTREAM_PORT:-80}
      EKIS_UPSTREAM_HOST: ${EKIS_UPSTREAM_HOST:-host.docker.internal}
      EKIS_UPSTREAM_PORT: ${EKIS_UPSTREAM_PORT:-8080}
      FORECAST_UPSTREAM_HOST: ${FORECAST_UPSTREAM_HOST:-host.docker.internal}
      FORECAST_UPSTREAM_PORT: ${FORECAST_UPSTREAM_PORT:-6104}
      AGENT_DEAL_UPSTREAM_HOST: ${AGENT_DEAL_UPSTREAM_HOST:-host.docker.internal}
      AGENT_DEAL_UPSTREAM_PORT: ${AGENT_DEAL_UPSTREAM_PORT:-1972}
      EKISP_UPSTREAM_HOST: ${EKISP_UPSTREAM_HOST:-host.docker.internal}
      EKISP_UPSTREAM_PORT: ${EKISP_UPSTREAM_PORT:-2003}
      AIRFLOW_UPSTREAM_HOST: ${AIRFLOW_UPSTREAM_HOST:-host.docker.internal}
      AIRFLOW_UPSTREAM_PORT: ${AIRFLOW_UPSTREAM_PORT:-2002}
      # Reach show-colima over the shared Docker network (avoids brittle host port forwards).
      COLIMA_UPSTREAM_HOST: ${COLIMA_UPSTREAM_HOST:-show-colima}
      COLIMA_UPSTREAM_PORT: ${COLIMA_UPSTREAM_PORT:-9998}
      AI_PORTAL_UPSTREAM_HOST: ${AI_PORTAL_UPSTREAM_HOST:-host.docker.internal}
      AI_PORTAL_UPSTREAM_PORT: ${AI_PORTAL_UPSTREAM_PORT:-5173}
      MEDICAL_ERD_UPSTREAM_HOST: ${MEDICAL_ERD_UPSTREAM_HOST:-host.docker.internal}
      MEDICAL_ERD_UPSTREAM_PORT: ${MEDICAL_ERD_UPSTREAM_PORT:-8765}
      MEDICAL_SQL_UPSTREAM_HOST: ${MEDICAL_SQL_UPSTREAM_HOST:-host.docker.internal}
      MEDICAL_SQL_UPSTREAM_PORT: ${MEDICAL_SQL_UPSTREAM_PORT:-8766}
      AI_DW_UPSTREAM_HOST: ${AI_DW_UPSTREAM_HOST:-host.docker.internal}
      AI_DW_UPSTREAM_PORT: ${AI_DW_UPSTREAM_PORT:-1101}
      UNIFIED_EKIS_UPSTREAM_HOST: ${UNIFIED_EKIS_UPSTREAM_HOST:-host.docker.internal}
      UNIFIED_EKIS_UPSTREAM_PORT: ${UNIFIED_EKIS_UPSTREAM_PORT:-9246}
      UNIFIED_EKIS_API_HOST: ${UNIFIED_EKIS_API_HOST:-host.docker.internal}
      UNIFIED_EKIS_API_PORT: ${UNIFIED_EKIS_API_PORT:-9247}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - /Users/etlers/workspace/db_hospital:/srv/db_hospital:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
